    <style type="text/tailwindcss">

        }

        header {
            @apply bg-teal-800 text-white text-center
            pt-8 px-[9%] pb-[42px] md:py-[3%] md:px-[20%];
        }

        header h1 {
            @apply text-5xl md:text-6xl font-extrabold tracking-tight uppercase;

        section {
            @apply pt-8 px-[9%] pb-[42px] md:py-[3%] md:px-[20%];
        }

        section h2 {
            @apply text-3xl font-serif font-semibold italic text-teal-900 tracking-wide mb-4;
        }

        section p {
            @apply text-lg leading-relaxed text-justify mb-4;
        }

        a {
            @apply text-teal-700 font-medium underline underline-offset-4
            hover:text-teal-900 focus:text-teal-900 transition-colors duration-300;
        }

        footer {
            @apply bg-stone-200 text-center text-sm tracking-wider uppercase
            px-[9%] py-6 md:px-[20%];
        }
