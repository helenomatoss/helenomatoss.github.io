<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorem ipsum dolor sit amet</title>
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    .hero {
      @apply flex items-center px-6 py-16 md:px-12 md:py-24;
    }

    .hero-content {
      @apply w-full max-w-4xl;
    }

    .hero h1 {
      @apply text-4xl leading-tight font-bold tracking-tight md:text-6xl;
      overflow-wrap: anywhere;
    }

    .hero h2 {
      @apply mt-6 max-w-2xl text-lg leading-relaxed font-normal md:mt-8 md:text-2xl;
      overflow-wrap: anywhere;
    }

    .hero h2[hidden] {
      display: none;
    }

    .hero-light {
      @apply bg-slate-50;
    }

    .hero-light h1 {
      @apply text-slate-900;
    }

    .hero-light h2 {
      @apply text-slate-700;
    }

    .hero-dark {
      @apply bg-slate-900;
    }

    .hero-dark h1 {
      @apply text-slate-50;
    }

    .hero-dark h2 {
      @apply text-slate-300;
    }

    .hero-centre {
      @apply justify-center text-center;
    }

    .hero-centre .hero-content,
    .hero-centre h2 {
      @apply mx-auto;
    }

    .hero-min-height {
      @apply min-h-[480px] md:min-h-[85vh];
    }

    /* Heading font family (one class per heading) */
    .hero-font-sans {
      @apply font-sans;
    }

    .hero-font-serif {
      @apply font-serif;
    }
  </style>
  <style>
    .hero .hero-content h1 {
      letter-spacing: 0.1em;
    }

    .hero .hero-content h2 {
      letter-spacing: 0.1em;
    }
  </style>
  <style type="text/tailwindcss">
    header.hero {
      background-color: var(--color-rose-500);
    }

    .hero .hero-content h1 {
      color: var(--color-cyan-950);
    }

    .hero .hero-content h2 {
      color: var(--color-yellow-300);
    }
  </style>
</head>
<body>
  <header class="hero hero-dark hero-centre hero-min-height">
    <div class="hero-content">
      <h1 class="hero-font-serif">Lorem ipsum dolor sit amet</h1>
      <h2 class="hero-font-serif">Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>
    </div>
  </header>
</body>
</html>
