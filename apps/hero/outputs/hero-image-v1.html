<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorem ipsum dolor sit amet</title>
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">
  <link rel="preload" as="image" href="assets/img/hero-image.jpg">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    /* Stacking order: image (z-0) → overlay (z-10) → content (z-20).
       "isolate" keeps these z-indexes inside the hero. */
    .hero {
      @apply relative isolate flex items-center overflow-hidden px-6 py-16 md:px-12 md:py-24;
    }

    /* Image layer: covers the whole hero, centred, cropped (never stretched) */
    .hero-image {
      @apply pointer-events-none absolute inset-0 z-0 bg-cover bg-center bg-no-repeat;
    }

    /* Tint layer: colour, gradient and opacity are set by the overlay rules */
    .hero-overlay {
      @apply pointer-events-none absolute inset-0 z-10;
    }

    /* Content layer: always above the overlay, always fully opaque */
    .hero-content {
      @apply relative z-20 w-full max-w-4xl;
    }

    .hero h1 {
      @apply text-4xl leading-tight font-bold tracking-tight text-shadow-lg/30 md:text-6xl;
      overflow-wrap: anywhere;
    }

    .hero h2 {
      @apply mt-6 max-w-2xl text-lg leading-relaxed font-normal text-shadow-lg/30 md:mt-8 md:text-2xl;
      overflow-wrap: anywhere;
    }

    .hero h2[hidden] {
      display: none;
    }

    .hero-centre {
      @apply justify-center text-center;
    }

    .hero-centre .hero-content,
    .hero-centre h2 {
      @apply mx-auto;
    }

    .hero-min-height {
      @apply min-h-[480px] md:min-h-[85vh];
    }

    /* Heading font family (one class per heading) */
    .hero-font-sans {
      @apply font-sans;
    }

    .hero-font-serif {
      @apply font-serif;
    }
  </style>
  <style>
    .hero .hero-image {
      background-image: url("assets/img/hero-image.jpg");
    }

    .hero .hero-content h1 {
      letter-spacing: -0.05em;
    }

    .hero .hero-content h2 {
      letter-spacing: -0.025em;
    }
  </style>
  <style type="text/tailwindcss">
    .hero .hero-overlay {
      background-color: transparent;
      background-image: linear-gradient(to right, var(--color-rose-500), var(--color-yellow-200));
      opacity: 0.4;
    }

    .hero .hero-content h1 {
      color: var(--color-pink-500);
    }

    .hero .hero-content h2 {
      color: var(--color-yellow-300);
    }
  </style>
</head>
<body>
  <header class="hero hero-min-height">
    <div class="hero-image" aria-hidden="true"></div>
    <div class="hero-overlay" aria-hidden="true"></div>
    <div class="hero-content">
      <h1 class="hero-font-sans">Lorem ipsum dolor sit amet</h1>
      <h2 class="hero-font-sans">Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>
    </div>
  </header>
</body>
</html>
